  --radius-lg:24px; --radius-md:16px; --radius-pill:999px;
}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;}
body{
  font-family:"Plus Jakarta Sans",-apple-system,sans-serif;
  background:
    radial-gradient(60% 40% at 15% 0%, rgba(157,78,221,0.35), transparent 60%),
    radial-gradient(50% 35% at 100% 20%, rgba(199,125,255,0.22), transparent 60%),
    radial-gradient(60% 40% at 90% 100%, rgba(111,20,168,0.28), transparent 55%),
    var(--bg-deep);
  background-attachment:fixed;
  color:var(--text-hi);
  min-height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:32px 16px;
}
#device-frame{
  width:390px;
  height:760px;
  border-radius:44px;
  border:10px solid rgba(255,255,255,0.05);
  box-shadow:0 40px 90px -25px rgba(157,78,221,0.5), 0 0 0 1px var(--glass-border);
  background:var(--bg-deep);
  overflow:hidden;
  position:relative;
  display:flex;
  flex-direction:column;
  flex-shrink:0;
}
#device-frame::before{
  content:"";
  position:absolute;
  top:14px;left:50%;transform:translateX(-50%);
  width:70px;height:5px;border-radius:4px;
  background:rgba(255,255,255,0.14);
  z-index:6;
}
#app{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;position:relative;}
@media (max-width:500px){
  body{padding:0;align-items:stretch;}
  #device-frame{width:100%;height:100vh;border-radius:0;border:none;box-shadow:none;}
  #device-frame::before{display:none;}
}
.glass{
  background:var(--glass);
  backdrop-filter:blur(22px) saturate(160%);
  -webkit-backdrop-filter:blur(22px) saturate(160%);
  border:1px solid var(--glass-border-soft);
  border-radius:var(--radius-lg);
}
.glass-strong{
  background:var(--glass-strong);
  backdrop-filter:blur(26px) saturate(160%);
  -webkit-backdrop-filter:blur(26px) saturate(160%);
  border:1px solid var(--glass-border);
  border-radius:var(--radius-lg);
}
.topbar{
  display:flex;align-items:center;gap:10px;padding:16px 18px;
  background:rgba(13,11,24,0.6);backdrop-filter:blur(18px);
  border-bottom:1px solid var(--glass-border-soft);
  position:sticky;top:0;z-index:5;
}
.topbar img{width:28px;height:28px;border-radius:8px;}
.topbar h2{font-size:16px;font-weight:700;margin:0;flex:1;color:var(--text-hi);}
.back-btn{
  display:flex;align-items:center;gap:5px;border:none;background:rgba(255,255,255,0.05);
  color:var(--text-hi);font-family:inherit;font-size:13px;font-weight:600;
  padding:7px 12px 7px 9px;border-radius:var(--radius-pill);cursor:pointer;flex-shrink:0;
}
.back-btn i{font-size:16px;}
.content{flex:1;padding:18px;padding-bottom:110px;}

.btn-primary{
  width:100%;height:56px;border:1px solid rgba(224,170,255,0.5);border-radius:var(--radius-md);
  background:linear-gradient(135deg, var(--violet-glow), #7B2FD1);
  color:#fff;font-family:inherit;font-size:15px;font-weight:700;
  display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;
  box-shadow:0 0 0 rgba(157,78,221,0), 0 10px 30px -8px rgba(157,78,221,0.75), inset 0 1px 0 rgba(255,255,255,0.25);
}
.btn-primary:disabled{opacity:0.35;cursor:not-allowed;box-shadow:none;}
.btn-secondary{
  width:100%;height:48px;border:1px solid var(--glass-border);border-radius:var(--radius-md);
  background:rgba(255,255,255,0.04);backdrop-filter:blur(10px);
  color:var(--text-hi);font-family:inherit;font-size:14px;font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;
}
.btn-ghost{border:none;background:transparent;color:var(--lavender-soft);font-family:inherit;font-weight:700;font-size:13px;cursor:pointer;padding:8px 0;}

.tag{font-size:11px;font-weight:700;padding:5px 11px;border-radius:var(--radius-pill);}
.tag-paid{background:var(--matcha-bg);color:var(--matcha);border:1px solid rgba(111,227,168,0.3);}
.tag-unpaid{background:var(--ume-bg);color:var(--ume);border:1px solid rgba(255,143,163,0.3);}

.chip{
  font-size:12px;font-weight:600;padding:7px 13px;border-radius:var(--radius-pill);
  border:1px solid var(--glass-border);color:var(--text-mid);background:rgba(255,255,255,0.03);
  cursor:pointer;font-family:inherit;
}
.chip.selected{
  background:linear-gradient(135deg, var(--violet-glow), #7B2FD1);
  border-color:transparent;color:#fff;
  box-shadow:0 4px 16px -4px rgba(157,78,221,0.7);
}
.chip.ghost{border-style:dashed;color:var(--text-dim);}

input[type=text],input[type=number],input[type=tel]{
  width:100%;height:44px;border-radius:12px;border:1px solid var(--glass-border-soft);
  padding:0 12px;font-family:inherit;font-size:13.5px;
  background:rgba(255,255,255,0.04);color:var(--text-hi);
}
input::placeholder{color:var(--text-dim);}
input:focus{outline:none;border-color:var(--lavender);box-shadow:0 0 0 3px rgba(157,78,221,0.25);}
label{font-size:11px;color:var(--text-dim);font-weight:700;letter-spacing:0.02em;}

.fab-bar{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;
  padding:16px 18px calc(16px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(13,11,24,0),var(--bg-deep) 40%);
  display:flex;flex-direction:column;gap:8px;
}
.hint{font-size:12px;color:var(--text-dim);line-height:1.5;}

.item-row{
  border:1px solid var(--glass-border-soft);border-radius:var(--radius-md);
  padding:12px 14px;margin-bottom:10px;background:rgba(255,255,255,0.03);
}
.item-row .row-top{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.item-row .row-top input[type=text]{border:none;background:transparent;padding:0;height:auto;font-size:14px;font-weight:600;}
.item-row .row-bottom{display:flex;align-items:center;gap:10px;}
.item-row .price-field{flex:1;position:relative;}
.item-row .price-field input{border:none;background:transparent;padding:0;height:auto;font-size:12.5px;color:var(--text-mid);}
.qty-stepper{display:flex;align-items:center;gap:0;border:1px solid var(--glass-border);border-radius:var(--radius-pill);overflow:hidden;flex-shrink:0;}
.qty-stepper button{width:26px;height:26px;border:none;background:rgba(255,255,255,0.05);color:var(--lavender-soft);font-size:15px;cursor:pointer;line-height:1;font-family:inherit;}
.qty-stepper span{min-width:22px;text-align:center;font-size:12.5px;font-weight:700;}
.line-total{font-size:13px;font-weight:700;color:var(--text-hi);flex-shrink:0;min-width:64px;text-align:right;}
.icon-btn{border:none;background:transparent;color:var(--text-dim);cursor:pointer;font-size:16px;padding:4px;}

.spinner{width:38px;height:38px;border:3px solid rgba(199,125,255,0.2);border-top-color:var(--lavender);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto;}
@keyframes spin{to{transform:rotate(360deg);}}
.empty{text-align:center;padding:40px 10px;color:var(--text-dim);font-size:13px;}
.toast{
  position:fixed;bottom:110px;left:50%;transform:translateX(-50%);
  background:var(--glass-strong);backdrop-filter:blur(20px);border:1px solid var(--glass-border);
  color:var(--text-hi);padding:11px 20px;border-radius:var(--radius-pill);font-size:13px;font-weight:600;
  z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;
}
.toast.show{opacity:1;}
</style>
</head>
<body>
<div id="device-frame">
  <div id="app"></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   State — in-memory (reset saat halaman di-reload).
   Untuk persistensi lintas sesi setelah di-deploy sendiri,
   ganti bagian riwayat di bawah dengan localStorage / IndexedDB.
   ============================================================ */
let state = {
  screen: 'home',
  history: [
    { id: 1, place: 'Izakaya Ronin', people: 4, when: 'kemarin', status: 'paid' },
  ],
  session: null,
};

const fmt = n => 'Rp' + Math.round(n || 0).toLocaleString('id-ID');
const uid = () => Math.random().toString(36).slice(2, 9);

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2200);
}

function newSession(){
  state.session = { items: [], people: [], tax: 10, service: 5, payment: '', place: 'Patungan baru' };
}
function newItem(name, price, qty){
  return { id: uid(), name: name || '', price: price || 0, qty: qty || 1, assignees: [] };
}

/* ---------- OCR parsing ---------- */
function parseReceiptText(text){
  const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
  const items = [];
  const priceRe = /([\d]{1,3}(?:[.,]\d{3})+|\d{4,7})\s*$/;
  const qtyRe = /(?:^|\s)(\d{1,2})\s*[xX]\b|\b[xX]\s*(\d{1,2})(?:\s|$)/;
  const skipWords = /total|subtotal|pajak|tax|service|ppn|kembali|bayar|cash|tunai|diskon|change|qty|jumlah/i;
  for (const line of lines) {
    if (skipWords.test(line)) continue;
    const m = line.match(priceRe);
    if (!m) continue;
    const priceRaw = m[1].replace(/[.,]/g, '');
    const price = parseInt(priceRaw, 10);
    if (!price || price < 500 || price > 5000000) continue;
    let rest = line.slice(0, m.index).trim();
    let qty = 1;
    const qm = rest.match(qtyRe);
    if (qm) { qty = parseInt(qm[1] || qm[2], 10) || 1; rest = rest.replace(qtyRe, '').trim(); }
    rest = rest.replace(/^[\d]+\.?\s*/, '');
    if (!rest) rest = 'Item';
    items.push(newItem(rest.slice(0, 40), price, qty));
  }
  return items;
}

let ocrCancelled = false;
function cancelOcr(){
  ocrCancelled = true;
  state.screen = 'home';
  render();
}

async function runOcr(file){
  try {
    if (!window.Tesseract) {
      await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js');
    }
    const { data } = await Tesseract.recognize(file, 'ind+eng');
    if (ocrCancelled) return;
    const items = parseReceiptText(data.text || '');
    newSession();
    state.session.items = items.length ? items : [newItem('Item 1', 0, 1)];
    if (!items.length) toast('Teks struk susah dibaca, cek & edit manual ya');
    state.screen = 'review';
  } catch (e) {
    if (ocrCancelled) return;
    console.error(e);
    newSession();
    state.session.items = [newItem('Item 1', 0, 1)];
    state.screen = 'review';
    toast('Scan gagal (cek koneksi internet) — isi manual dulu');
  }
  render();
}
function loadScript(src){
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src; s.onload = resolve; s.onerror = reject;
    document.head.appendChild(s);
  });
}
function handleFile(input){
  const file = input.files[0];
  if (!file) return;
  ocrCancelled = false;
  showOcrLoading();
  runOcr(file);
}
function showOcrLoading(){
  document.getElementById('app').innerHTML = `
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:16px;padding:24px;text-align:center;">
      <div class="spinner"></div>
      <p style="font-size:13px;color:var(--text-mid);">Membaca struk...</p>
      <button class="back-btn" onclick="cancelOcr()" style="margin-top:6px;"><i class="ti ti-arrow-left" aria-hidden="true"></i>Batal, salah foto</button>
    </div>`;
}
function startManual(){
  newSession();
  state.session.items = [newItem('', 0, 1)];
  state.screen = 'review';
  render();
}

/* ---------- item editing ---------- */
function updateItem(id, field, value){
  const it = state.session.items.find(i => i.id === id);
  if (!it) return;
  it[field] = field === 'price' ? (parseInt(String(value).replace(/\D/g,''),10) || 0) : value;
}
function changeQty(id, delta){
  const it = state.session.items.find(i => i.id === id);
  if (!it) return;
  it.qty = Math.max(1, Math.min(99, (it.qty||1) + delta));
  render();
}
function addItem(){
  state.session.items.push(newItem('', 0, 1));
  render();
}
function removeItem(id){
  state.session.items = state.session.items.filter(i => i.id !== id);
  render();
}
function setTaxService(field, value){
  state.session[field] = parseFloat(value) || 0;
}

/* ---------- people & assign ---------- */
function addPerson(){
  const input = document.getElementById('newPersonInput');
  const name = (input.value || '').trim();
  if (!name) return;
  if (!state.session.people.includes(name)) state.session.people.push(name);
  input.value = '';
  render();
}
function s_removePerson(name){
  state.session.people = state.session.people.filter(p => p !== name);
  state.session.items.forEach(i => { i.assignees = i.assignees.filter(p => p !== name); });
  render();
}
function toggleAssign(itemId, person){
  const it = state.session.items.find(i => i.id === itemId);
  if (!it) return;
  const idx = it.assignees.indexOf(person);
  if (idx >= 0) it.assignees.splice(idx, 1); else it.assignees.push(person);
  render();
}

/* ---------- calculations ---------- */
function itemTotal(it){ return (it.price||0) * (it.qty||1); }

function calcSummary(){
  const { items, tax, service, people } = state.session;
  const subtotal = items.reduce((s, i) => s + itemTotal(i), 0);
  const perPerson = {};
  people.forEach(p => perPerson[p] = 0);
  items.forEach(it => {
    if (!it.assignees.length) return;
    const share = itemTotal(it) / it.assignees.length;
    it.assignees.forEach(p => { perPerson[p] = (perPerson[p] || 0) + share; });
  });
  const assignedTotal = Object.values(perPerson).reduce((a,b) => a+b, 0) || 1;
  const taxAmt = subtotal * (tax/100);
  const serviceAmt = subtotal * (service/100);
  const grandTotal = subtotal + taxAmt + serviceAmt;
  const result = {};
  people.forEach(p => {
    const base = perPerson[p] || 0;
    const ratio = base / assignedTotal;
    result[p] = {
      base,
      total: base + (taxAmt * ratio) + (serviceAmt * ratio),
      items: state.session.items.filter(i => i.assignees.includes(p)),
      paid: state.session.paidStatus?.[p] || false,
    };
  });
  return { subtotal, taxAmt, serviceAmt, grandTotal, result };
}
function togglePaid(person){
  state.session.paidStatus = state.session.paidStatus || {};
  state.session.paidStatus[person] = !state.session.paidStatus[person];
  render();
}

function copyWhatsapp(){
  const { subtotal, taxAmt, serviceAmt, grandTotal, result } = calcSummary();
  let text = `*Ringkasan patungan — ${state.session.place}*\n\n`;
  Object.entries(result).forEach(([person, r]) => {
    text += `*${person}* — ${fmt(r.total)}\n`;
    r.items.forEach(it => {
      const qtyLabel = it.qty > 1 ? ` x${it.qty}` : '';
      const share = it.assignees.length > 1 ? ` (patungan ${it.assignees.length} orang)` : '';
      text += `  • ${it.name}${qtyLabel}${share}: ${fmt(itemTotal(it) / it.assignees.length)}\n`;
    });
    text += `\n`;
  });
  text += `Subtotal: ${fmt(subtotal)}\nPajak: ${fmt(taxAmt)}\nService: ${fmt(serviceAmt)}\n*Total: ${fmt(grandTotal)}*\n`;
  if (state.session.payment) text += `\nBayar ke: ${state.session.payment}`;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => toast('Tersalin, tempel ke WhatsApp')).catch(() => fallbackCopy(text));
  } else { fallbackCopy(text); }
}
function fallbackCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text; document.body.appendChild(ta); ta.select();
  document.execCommand('copy'); document.body.removeChild(ta);
  toast('Tersalin, tempel ke WhatsApp');
}
function finishSession(){
  state.history.unshift({
    id: uid(), place: state.session.place, people: state.session.people.length,
    when: 'baru saja', status: Object.values(state.session.paidStatus||{}).every(Boolean) && state.session.people.length ? 'paid' : 'unpaid',
  });
  state.session = null;
  state.screen = 'home';
  render();
}
function goto(screen){ state.screen = screen; render(); }
function confirmBackHome(){
  if (confirm('Kembali ke beranda? Perubahan yang belum disimpan akan hilang.')) {
    state.session = null;
    state.screen = 'home';
    render();
  }
}

function escapeHtml(str){
  return (str||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function jsAttr(str){
  return (str||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'");
}

/* ============================================================
   Render
   ============================================================ */
function render(){
  const app = document.getElementById('app');
  app.innerHTML = screens[state.screen] ? screens[state.screen]() : screens.home();
}

const screens = {

home(){
  const rows = state.history.map(h => `
    <div class="glass" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;padding:14px 16px;">
      <div><p style="font-size:13.5px;font-weight:700;margin:0;">${escapeHtml(h.place)}</p>
        <p style="font-size:11.5px;color:var(--text-dim);margin:3px 0 0;">${h.people} orang · ${h.when}</p></div>
      <span class="tag ${h.status==='paid'?'tag-paid':'tag-unpaid'}">${h.status==='paid'?'Lunas':'Belum semua bayar'}</span>
    </div>`).join('') || '<p class="empty">Belum ada riwayat patungan.</p>';

  if (!state.session) { newSession(); state.session.items=[newItem('',0,1)]; }
  const s = state.session;
  const itemsHtml = s.items.map(it => `
    <div class="item-row">
      <div class="row-top">
        <input type="text" placeholder="Nama item" value="${escapeHtml(it.name)}" oninput="updateItem('${it.id}','name',this.value)">
        <button class="icon-btn" onclick="removeItem('${it.id}')"><i class="ti ti-trash"></i></button>
      </div>
      <div class="row-bottom">
        <div class="price-field">
          <label style="display:block;">harga satuan</label>
          <input type="number" value="${it.price}" oninput="updateItem('${it.id}','price',this.value)">
        </div>
        <div class="qty-stepper">
          <button onclick="changeQty('${it.id}',-1)">−</button>
          <span>${it.qty}</span>
          <button onclick="changeQty('${it.id}',1)">+</button>
        </div>
        <span class="line-total">${fmt(itemTotal(it))}</span>
      </div>
    </div>`).join('');

  return `
  <div class="topbar"><button class="back-btn" onclick="confirmBackHome()"><i class="ti ti-arrow-left" aria-hidden="true"></i>Kembali</button><h2>Cek hasil scan</h2></div>
  <div class="content">
    <input type="text" value="${escapeHtml(s.place)}" placeholder="Nama tempat / judul patungan"
      style="font-weight:700;margin-bottom:16px;" oninput="state.session.place=this.value">
    ${itemsHtml}
    <button class="btn-ghost" onclick="addItem()"><i class="ti ti-plus" style="font-size:13px;"></i> Tambah item</button>
    <p class="hint" style="margin:2px 0 14px;">Menu yang sama? Pakai stepper qty di kanan, gak perlu ketik ulang.</p>
    <div style="display:flex;gap:10px;">
      <div style="flex:1;"><label>Pajak %</label><div style="height:4px;"></div>
        <input type="number" value="${s.tax}" oninput="setTaxService('tax',this.value)"></div>
      <div style="flex:1;"><label>Service %</label><div style="height:4px;"></div>
        <input type="number" value="${s.service}" oninput="setTaxService('service',this.value)"></div>
    </div>
  </div>
  <div class="fab-bar">
    <button class="btn-primary" onclick="goto('assign')">Lanjut ke pembagian</button>
  </div>`;
},

assign(){
  const s = state.session;
  const chips = s.people.map(p => `<span class="chip selected" onclick="if(confirm('Hapus ${escapeHtml(p)} dari daftar?')){s_removePerson('${jsAttr(p)}')}">${escapeHtml(p)} <i class="ti ti-x" style="font-size:10px;"></i></span>`).join('');
  const itemsHtml = s.items.map(it => {
    const qtyLabel = it.qty > 1 ? ` ×${it.qty}` : '';
    const shareInfo = it.assignees.length > 1 ? `<p style="font-size:11.5px;color:var(--text-dim);margin:0 0 8px;">dibagi rata ${it.assignees.length} orang &rarr; ${fmt(itemTotal(it)/it.assignees.length)}/orang</p>` : '';
    const peopleChips = s.people.map(p => `<span class="chip ${it.assignees.includes(p)?'selected':''}" onclick="toggleAssign('${it.id}','${jsAttr(p)}')">${escapeHtml(p)}</span>`).join('');
    return `<div class="glass" style="margin-bottom:10px;padding:14px;">
      <p style="font-size:13.5px;font-weight:700;margin:0 0 4px;">${escapeHtml(it.name)||'(tanpa nama)'}${qtyLabel} · ${fmt(itemTotal(it))}</p>
      ${shareInfo}
      <div style="display:flex;gap:6px;flex-wrap:wrap;">${peopleChips || '<span class="hint">Tambah nama dulu di atas</span>'}</div>
    </div>`;
  }).join('');

  return `
  <div class="topbar"><button class="back-btn" onclick="goto('review')"><i class="ti ti-arrow-left" aria-hidden="true"></i>Kembali</button><h2>Siapa yang ikut?</h2></div>
  <div class="content">
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;">${chips}</div>
    <div style="display:flex;gap:8px;">
      <input type="text" id="newPersonInput" placeholder="Nama teman" onkeydown="if(event.key==='Enter')addPerson()">
      <button class="btn-secondary" style="width:auto;padding:0 16px;flex-shrink:0;" onclick="addPerson()"><i class="ti ti-plus"></i></button>
    </div>
    <p class="hint" style="margin:18px 0 10px;">Tap nama, lalu tap item pesanannya</p>
    ${itemsHtml}
  </div>
  <div class="fab-bar">
    <button class="btn-primary" onclick="goto('summary')" ${!s.people.length?'disabled':''}>Lihat ringkasan</button>
  </div>`;
},

summary(){
  const s = state.session;
  const { subtotal, taxAmt, serviceAmt, grandTotal, result } = calcSummary();
  const cards = Object.entries(result).map(([person, r]) => `
    <div class="glass" style="margin-bottom:10px;padding:14px;">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <p style="font-size:14px;font-weight:700;margin:0;">${escapeHtml(person)}</p>
        <span style="font-size:14px;font-weight:800;color:var(--lavender-soft);">${fmt(r.total)}</span>
      </div>
      <p style="font-size:11.5px;color:var(--text-dim);margin:4px 0 10px;">
        ${r.items.map(i=>escapeHtml(i.name)).join(', ') || 'tidak ada item'} + pajak/service
      </p>
      <button style="width:100%;height:34px;border-radius:999px;border:1px solid ${r.paid?'rgba(111,227,168,0.3)':'rgba(255,143,163,0.3)'};font-family:inherit;font-size:12px;font-weight:700;
        background:${r.paid?'var(--matcha-bg)':'var(--ume-bg)'};color:${r.paid?'var(--matcha)':'var(--ume)'};"
        onclick="togglePaid('${jsAttr(person)}')">${r.paid?'Lunas':'Belum bayar'}</button>
    </div>`).join('') || '<p class="empty">Belum ada orang yang ditambahkan.</p>';

  return `
  <div class="topbar"><button class="back-btn" onclick="goto('assign')"><i class="ti ti-arrow-left" aria-hidden="true"></i>Kembali</button><h2>Ringkasan tagihan</h2></div>
  <div class="content">
    <div class="glass-strong" style="margin-bottom:16px;padding:16px;">
      <div style="display:flex;justify-content:space-between;font-size:12.5px;color:var(--text-mid);"><span>Subtotal</span><span>${fmt(subtotal)}</span></div>
      <div style="display:flex;justify-content:space-between;font-size:12.5px;color:var(--text-mid);margin-top:5px;"><span>Pajak</span><span>${fmt(taxAmt)}</span></div>
      <div style="display:flex;justify-content:space-between;font-size:12.5px;color:var(--text-mid);margin-top:5px;"><span>Service</span><span>${fmt(serviceAmt)}</span></div>
      <div style="display:flex;justify-content:space-between;font-size:16px;font-weight:800;margin-top:10px;padding-top:10px;border-top:1px solid var(--glass-border-soft);"><span>Total</span><span style="color:var(--lavender-soft);">${fmt(grandTotal)}</span></div>
    </div>
    ${cards}
    <label>No. rekening / QRIS</label>
    <div style="height:4px;"></div>
    <input type="text" placeholder="BCA 1234567890 a.n. Rafi" value="${escapeHtml(s.payment)}" oninput="state.session.payment=this.value">
  </div>
  <div class="fab-bar">
    <button class="btn-primary" onclick="copyWhatsapp()"><i class="ti ti-brand-whatsapp" style="font-size:17px;"></i> Salin ringkasan ke WhatsApp</button>
    <button class="btn-secondary" onclick="finishSession()">Selesai & simpan ke riwayat</button>
  </div>`;
},

};

render();
</script>
</body>
</html>
